# Build candidates independently; release only after explicit activation.
# COLLECTION_OF_BEAUTY_ROLLOUT_MODE: unset/off, manual, or automatic.
name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Build, deploy a reviewed image, roll back to a retained image, or verify a release
        type: choice
        options: [build, deploy, rollback, verify]
        default: build
      target_sha:
        description: Full commit SHA (required for deploy, rollback or verify)
        type: string
        required: false
      image_digest:
        description: Exact sha256 image digest from the build artifact (deploy or rollback)
        type: string
        required: false
      expected_current_digest:
        description: Reviewed current latest digest (deploy or rollback)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Typecheck + unit tests gate image publication. Several suites exist purely as
  # tripwires over the *generated* catalogue (see tests/artist-names-corpus.test.ts)
  # and used to run only when a human remembered — .husky/pre-commit is
  # lint-staged only, and .husky/pre-push runs the R2 verify alone, and only
  # when src/data/artworks.json changed. The whole suite is a few seconds;
  # cheap insurance against shipping a catalogue regression.
  test:
    if: github.repository == 'trebeljahr/collection-of-beauty' && github.ref == 'refs/heads/main' && inputs.operation != 'verify' && inputs.operation != 'deploy' && inputs.operation != 'rollback'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      # Same pnpm provisioning as the Dockerfile's build stage: corepack
      # honours the `packageManager` field, so CI and the image agree on
      # the version without pinning it in a second place.
      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        env:
          HUSKY: "0"
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Release and drain contract tests
        run: pnpm test:release

  # Asset/R2 drift verification used to gate the deploy here, but a full
  # HEAD sweep of every variant (now ~39k keys) tripped Cloudflare's rate
  # limits and false-failed on network errors (`fetch failed`), blocking
  # deploys even though the assets were present. It now runs locally via
  # the .husky/pre-push hook — a single bulk rclone LIST, in-memory
  # membership check, no rate-limit exposure — and only when
  # src/data/artworks.json changes. Drift is caught before the push ever
  # reaches CI. See scripts/verify-r2.mjs and .husky/pre-push.
  build:
    if: github.repository == 'trebeljahr/collection-of-beauty' && github.ref == 'refs/heads/main' && inputs.operation != 'verify' && inputs.operation != 'deploy' && inputs.operation != 'rollback'
    needs: test
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify the press kit object before publishing an image
        run: node scripts/press-kit-download.mjs --ci
      - name: Verify the serving parent and reject an existing SHA tag
        id: parent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/prepare-asset-build.mjs

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ github.sha }}

      - id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          # Next's skew protection id, see the Dockerfile.
          build-args: |
            DEPLOYMENT_ID=${{ github.sha }}
            PREVIOUS_IMAGE=${{ steps.parent.outputs.previous_image }}
            PREVIOUS_SHA=${{ steps.parent.outputs.previous_sha }}
            PREVIOUS_DIGEST=${{ steps.parent.outputs.previous_digest }}
          # BuildKit secret for decrypting .env.production at build
          # time. Mounted as tmpfs inside the Dockerfile's RUN step,
          # never written to a layer or `docker history`. The Dockerfile
          # exposes it as the DOTENV_PRIVATE_KEY_PRODUCTION env var for
          # `dotenvx run -- pnpm build`, which decrypts in memory and
          # bakes NEXT_PUBLIC_* / VITE_* values into the bundle.
          secrets: |
            dotenvx_private_key=${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}

      - name: Record immutable release identity
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const { GITHUB_SHA: commit, IMAGE: image, IMAGE_DIGEST: digest } = process.env;
          if (!/^[a-f0-9]{40}$/.test(commit) || !/^sha256:[a-f0-9]{64}$/.test(digest)) {
            throw new Error('Build did not provide a full commit and image digest.');
          }
          writeFileSync('release.json', JSON.stringify({ commit, image, digest, reference: `${image}@${digest}` }, null, 2) + '\n');
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release.json
            build-inputs.json
          if-no-files-found: error

  # This only observes public HTTP responses. It never queues a deployment,
  # changes a registry tag, or treats a webhook commit as proof of image identity.
  verify:
    if: github.repository == 'trebeljahr/collection-of-beauty' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.operation == 'verify'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify the serving commit
        env:
          EXPECTED_SHA: ${{ inputs.target_sha }}
        run: node scripts/verify-release.mjs "$EXPECTED_SHA"

  deploy:
    needs: build
    if: >-
      always() && !cancelled() &&
      github.repository == 'trebeljahr/collection-of-beauty' && github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && vars.COLLECTION_OF_BEAUTY_ROLLOUT_MODE == 'automatic' && needs.build.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && (inputs.operation == 'deploy' || inputs.operation == 'rollback')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Promote, queue this app, and verify the release
        env:
          ROLLOUT_MODE: ${{ vars.COLLECTION_OF_BEAUTY_ROLLOUT_MODE }}
          OPERATION: ${{ github.event_name == 'workflow_dispatch' && inputs.operation || 'deploy' }}
          TARGET_SHA: ${{ github.event_name == 'push' && github.sha || inputs.target_sha }}
          TARGET_DIGEST: ${{ github.event_name == 'push' && needs.build.outputs.digest || inputs.image_digest }}
          EXPECTED_CURRENT_DIGEST: ${{ inputs.expected_current_digest }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_RESOURCE_UUID: ${{ secrets.COOLIFY_RESOURCE_UUID }}
          COOLIFY_DEPLOY_SECRET: ${{ secrets.COOLIFY_DEPLOY_SECRET }}
          COOLIFY_DEPLOY_REPOSITORY: ${{ secrets.COOLIFY_DEPLOY_REPOSITORY }}
          COOLIFY_DEPLOY_BRANCH: ${{ secrets.COOLIFY_DEPLOY_BRANCH }}
        run: node scripts/rolling-release.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rollout-${{ github.run_id }}-${{ github.run_attempt }}
          path: rollout.json
          if-no-files-found: warn
